<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LifeKit</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <a id="home" class="brand" href="#" title="Open the LifeKit website">
        <img src="icons/icon32.png" alt="" width="24" height="24" />
        <span>Life<b>Kit</b></span>
      </a>
      <span class="tag">60+ free tools</span>
    </header>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search tools…" aria-label="Search tools" autocomplete="off" autofocus />
    </div>
    <ul id="list" role="listbox" aria-label="Tools"></ul>
    <p id="empty" hidden>No tools match. Try “pdf” or “image”.</p>
    <footer>
      <span>Tools open on the LifeKit website. Files stay on your device.</span>
      <kbd>Alt+Shift+L</kbd>
    </footer>
    <script src="config.js"></script>
    <script src="tools.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
