<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="LifeKit" />
    <meta name="theme-color" content="#110e19" />
    <title>LifeKit – 90 Free Everyday Tools: PDF, Image, Student & Money</title>
    <meta name="description" content="Free online tools that run in your browser: PDF to Word, compress photos to 20KB, sign PDFs, CGPA and attendance calculators, resume builder, timers and more." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LifeKit" />
    <meta property="og:title" content="LifeKit – Everyday tools, beautifully simple" />
    <meta property="og:description" content="90 free, private tools for PDFs, photos, students, money and time. No sign-up." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint (dark is the default) to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('lifekit:theme');
          var dark = t !== 'light' && (t !== 'system' || window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>LifeKit's tools run in your browser and need JavaScript to be enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
