<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0f172a" />
    <title>LifeKit – Free Everyday Tools, All in One Place</title>
    <meta name="description" content="LifeKit is a free collection of fast, private everyday tools: merge and split PDFs, compress images, generate QR codes and passwords, convert units and more. Files are processed in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LifeKit" />
    <meta property="og:title" content="LifeKit – Free Everyday Tools, All in One Place" />
    <meta property="og:description" content="Fast, private, free everyday tools for PDFs, images, text, calculations and more." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('lifekit:theme');
          var dark = t === 'dark' || ((t === null || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>LifeKit's tools run in your browser and need JavaScript to be enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
